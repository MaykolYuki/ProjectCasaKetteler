spring.application.name=projectcasaketteler
spring.jackson.time-zone=America/Lima
server.port=8001

# Conexión a Base de Datos
spring.datasource.url=jdbc:mysql://localhost:3306/casaKetteler
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# CONFIGURACIÓN CORREGIDA PARA CREAR TABLAS
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# NOTA: Se eliminó 'hibernate.hbm2ddl.auto=none' porque bloqueaba la creación de tablas.

# Estrategia de nombres (Para que respete tus @Table(name="..."))
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Configuración de Hikari (Pool de conexiones)
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# Configuración de archivos
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB
file.upload-dir=storage